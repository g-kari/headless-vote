name: Dependabot auto-merge

# Dependabot covers security updates only (see .github/dependabot.yml);
# Renovate covers regular updates with its own automerge. This workflow
# enables GitHub auto-merge on dependabot[bot] PRs so they merge as soon
# as the required CI checks pass.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
