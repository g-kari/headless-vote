name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck (app + tests)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Security regressions (SQLite migration chain)
        run: npm run test:security:node
