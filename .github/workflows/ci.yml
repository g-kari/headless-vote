name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck (app + tests)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Security regressions (SQLite migration chain)
        run: npm run test:security:node
      - name: Build deployment bundle without deploying
        run: npx wrangler deploy --dry-run --outdir dist/worker
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Retain verified deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: worker-bundle
          path: dist/worker/index.js
          if-no-files-found: error
          retention-days: 7
