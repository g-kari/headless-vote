name = "headless-vote"
main = "src/index.ts"
compatibility_date = "2025-11-01"
# The workers.dev hostname is a second origin. Login is pinned to APP_ORIGIN,
# and a public *.workers.dev URL would bypass that. Keep it off.
workers_dev = false

# Public domain. The custom domain automatically provisions its DNS record
# in the 0g0.xyz zone (same Cloudflare account) on deploy.
routes = [
  { pattern = "vote.0g0.xyz", custom_domain = true },
]

# Brand assets (favicon, logo, OGP) served as static files; requests that do
# not match a file fall through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# Identity provider and origin for this deployment (0g0-id).
# Secrets (SESSION_SECRET and, for confidential clients, OIDC_CLIENT_SECRET)
# are set with `wrangler secret put` and are not listed here.
[vars]
AUTH_PROVIDER = "oidc"
EMAIL_PROVIDER = "outbox"
OIDC_ISSUER = "https://id.0g0.xyz"
OIDC_CLIENT_ID = "cc4982bfefdddef9129577fd9a239946"
OIDC_SCOPES = "openid profile email"
# Host allowed to start the admin login. Browser embed origins are NOT
# configured here — each workspace sets those in the admin settings screen.
APP_ORIGIN = "https://vote.0g0.xyz"

[[d1_databases]]
binding = "DB"
database_name = "headless-vote"
database_id = "4c266b0f-c748-4037-88c0-ab2dce040681"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "headless-vote-images"

# Retry bounded cleanup of images belonging to deleted workspaces.
[triggers]
crons = ["0 3 * * *"]
